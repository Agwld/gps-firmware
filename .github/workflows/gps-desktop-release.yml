name: GPS Desktop release

# Pushing a tag such as desktop-v1.2.3 builds the desktop app for every platform and publishes it.
# The desktop- prefix keeps app releases apart from firmware releases, which use plain v tags.
on:
  push:
    tags: ["desktop-v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: GPS-Desktop

jobs:
  build:
    strategy:
      # Let every platform finish, so one run shows all failures. Publishing still needs all three.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries for Qt and Tk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 tk

      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v

      - name: Build
        shell: bash
        run: python packaging/build.py build --version "${GITHUB_REF_NAME#desktop-v}" --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: GPS-Desktop/release/*
          if-no-files-found: error

  publish:
    # Publishing once, after all builds pass, means an update is never offered half uploaded.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: GPS-Desktop/release
          merge-multiple: true
      - name: Write the manifest
        run: python packaging/build.py manifest --version "${GITHUB_REF_NAME#desktop-v}" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Publish the release
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" release/* --latest=false --title "GPS Desktop $version" \
            --notes "GPS Desktop $version. To install, download and run the GPSDesktopSetup file for your system. Installed copies update themselves."
      - name: Point installed apps at this release
        # Installed apps and the setup program read the manifest from this fixed tag, because the
        # repository's own "latest" release may be a firmware release. Updated last, so nothing
        # is offered before its files exist.
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --latest=false \
            --target "$GITHUB_SHA" --title "GPS Desktop (latest)" \
            --notes "Always holds the setup programs for the newest GPS Desktop release. Download GPSDesktopSetup for your system from here."
          gh release upload desktop-latest release/GPSDesktopSetup-* release/manifest.json --clobber
